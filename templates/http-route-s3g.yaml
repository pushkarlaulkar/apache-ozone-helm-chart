{{- if and .Values.s3g (eq (toString .Values.s3g.replicas) "1") .Values.httpRoutes.s3g.enabled -}}
{{- $route := .Values.httpRoutes.s3g -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-{{ $route.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ozone-s3g-route
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  hostnames:
    {{- toYaml $route.hostnames | nindent 4 }}
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  rules:
    {{- range $rule := $route.rules }}
    - matches:
        {{- toYaml $rule.matches | nindent 8 }}
      backendRefs:
        {{- range $backend := $rule.backendRefs }}
        - group: {{ $backend.group | default "" }}
          kind: {{ $backend.kind | default "Service" }}
          name: {{ $.Release.Name }}-{{ $backend.name }}
          port: {{ $backend.port }}
          weight: {{ $backend.weight | default 1 }}
        {{- end }}
    {{- end }}
{{- end -}}