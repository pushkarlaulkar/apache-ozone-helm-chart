apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ozone-secret-manager-binding
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
subjects:
- kind: ServiceAccount
  name: ozone-bootstrap-sa
roleRef:
  kind: Role
  name: ozone-secret-manager-role
  apiGroup: rbac.authorization.k8s.io