{{- if .Values.secretSyncJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.secretSyncJob.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.secretSyncJob.serviceAccountName }}
      restartPolicy: OnFailure
      containers:
        - name: secret-sync
          image: "{{ .Values.secretSyncJob.image.repository }}:{{ .Values.secretSyncJob.image.tag }}"
          imagePullPolicy: {{ .Values.secretSyncJob.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              POD="{{ .Values.secretSyncJob.podName }}"
              NAMESPACE="{{ .Release.Namespace }}"
              
              # Dynamically generated from values.yaml kerberos keytabs
              entries=(
                  {{- range .Values.kerberos.keytabs }}
                  "/opt/hadoop/etc/hadoop/{{ .name }}.keytab:{{ .principal }}@{{ $.Values.kerberos.realm }}"
                  {{- end }}
              )
              
              for entry in "${entries[@]}"; do
                  IFS=':' read -r keytab principal <<< "$entry"
                  secret_name="ozone-s3-$(echo "$principal" | sed 's|/|-|g' | tr '[:upper:]' '[:lower:]' | cut -d'@' -f1)"
                  
                  # Check if the secret already exists
                  if kubectl get secret "$secret_name" -n "$NAMESPACE" &>/dev/null; then
                      echo "Secret '$secret_name' already exists. Skipping..."
                      continue
                  fi
                  
                  echo "Generating S3 secret for $principal..."
                  output=$(kubectl exec -n "$NAMESPACE" "$POD" -- bash -c "
                      export KRB5_CONFIG=/opt/hadoop/etc/hadoop/krb5.conf
                      kinit -kt $keytab $principal
                      ozone s3 getsecret
                  ")
                  
                  access_key=$(echo "$output" | grep "awsAccessKey=" | cut -d'=' -f2 | tr -d '\r')
                  secret_key=$(echo "$output" | grep "awsSecret=" | cut -d'=' -f2 | tr -d '\r')
                  
                  kubectl create secret generic "$secret_name" \
                      --namespace="$NAMESPACE" \
                      --from-literal=aws-access-key="$access_key" \
                      --from-literal=aws-secret-key="$secret_key" \
                      --dry-run=client -o yaml | kubectl apply -f -
              done
{{- end -}}